version: 2
updates:
  # Keeps the SHA-pinned actions in ci.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript < 6.1; lift this once it adds 7.x.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      npm:
        update-types: [minor, patch]
