# Fixture cases for every built-in rule. See tests/rule_fixtures.rs.
#
# - `tree`: entries to create (a trailing `\` makes a directory; parents are
#   created as directories). Inline tables add `size`, `age_days`, `magic`
#   and `flags`.
# - `match`: paths the rule must match itself (not by inheritance).
# - `no_match`: near-miss paths the rule must not match itself.
# - `auto_near_miss` (default true) also checks `<path>_nearmiss`.
# Per-user tokens expand to both fixture profiles (alice and bob).

