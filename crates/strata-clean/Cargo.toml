[package]
name = "strata-clean"
description = "Safe deletion for Strata: never-list, pre-flight, Recycle Bin, permanent delete, lock detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
strata-core = { path = "../strata-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Must match the windows-core that windows 0.62 depends on; the
# #[implement] macro expands to paths in this crate.
windows-core = "0.62.2"
windows = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
