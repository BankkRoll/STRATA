[package]
name = "strata-walk"
description = "Strata fallback walker: parallel unelevated directory traversal emitting scan records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
strata-core = { path = "../strata-core" }
rayon = { workspace = true }
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }
windows = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest = { workspace = true }
# Tests register a throwaway cloud-files sync root to prove the walker never
# hydrates placeholders.
windows = { workspace = true, features = [
    "Win32_Storage_CloudFilters",
    "Win32_System_CorrelationVector",
] }

[lints]
workspace = true
