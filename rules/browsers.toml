# Web browsers, every profile (SPEC §12.2 "Browsers").
#
# Profile data (history, cookies, passwords, bookmarks, extensions) is
# `never`: it is not junk. Caches inside are carved out by more specific path
# globs and are `safe` (warn if the browser is running).

schema_version = 1
pack = "browsers"
version = 1
description = "Chrome, Edge, Brave, Opera/Opera GX, Vivaldi, Arc, Chromium and Firefox profiles and caches."

[lists]
# Per-profile cache folders of Chromium-based browsers.
chromium_profile_caches = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "Media Cache", "Application Cache", "Download Service"]
# Cache folders at the root of a Chromium "User Data" folder.
chromium_root_caches = ["ShaderCache", "GrShaderCache", "GraphiteDawnCache", "GPUPersistentCache", "component_crx_cache", "extensions_crx_cache", "Crashpad"]

# ----------------------------------------------------------------------------- Chrome

[[rule]]
id = "browsers.chrome.profile"
name = "Chrome profile data"
category = "apps"
safety = "never"
app = "Google Chrome"
explain = "Chrome's history, cookies, saved passwords, bookmarks and extensions for every profile. Not junk; clear browsing data from Chrome's settings instead."
match.path_glob = '{LOCALAPPDATA}\Google\Chrome*\User Data'

[[rule]]
id = "browsers.chrome.cache"
name = "Chrome cache"
category = "caches"
subcategory = "browser.cache"
safety = "safe"
regenerable = true
app = "Google Chrome"
explain = "Web and GPU caches for a Chrome profile. Chrome rebuilds them; close Chrome first."
match.path_glob = ['{LOCALAPPDATA}\Google\Chrome*\User Data\*\*', '{LOCALAPPDATA}\Google\Chrome*\User Data\*\Service Worker\CacheStorage', '{LOCALAPPDATA}\Google\Chrome*\User Data\*\Service Worker\ScriptCache']
match.dir_name = ["@chromium_profile_caches", "CacheStorage", "ScriptCache"]

[[rule]]
id = "browsers.chrome.root_cache"
name = "Chrome shared caches"
category = "caches"
subcategory = "browser.cache"
safety = "safe"
regenerable = true
app = "Google Chrome"
explain = "Shader, component and crash-report caches shared by all Chrome profiles. Rebuilt automatically."
match.path_glob = '{LOCALAPPDATA}\Google\Chrome*\User Data\*'
match.dir_name = "@chromium_root_caches"

