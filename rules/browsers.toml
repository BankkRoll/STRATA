match.path_glob = ['{LOCALAPPDATA}\Opera Software\Opera*\*', '{LOCALAPPDATA}\Opera Software\Opera*\*\*', '{APPDATA}\Opera Software\Opera*\*', '{APPDATA}\Opera Software\Opera*\*\*', '{APPDATA}\Opera Software\Opera*\*\Service Worker\CacheStorage']
match.dir_name = ["@chromium_profile_caches", "@chromium_root_caches", "System Cache", "CacheStorage"]

