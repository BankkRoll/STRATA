category = "apps"
safety = "never"
app = "Mozilla Firefox"
explain = "Firefox's history, cookies, saved passwords, bookmarks and add-ons. Clear browsing data from Firefox's settings instead."
match.path_glob = ['{APPDATA}\Mozilla\Firefox\Profiles\*', '{FIREFOX_PROFILE}']

[[rule]]
id = "browsers.firefox.cache"
name = "Firefox cache"
category = "caches"
subcategory = "browser.cache"
safety = "safe"
regenerable = true
app = "Mozilla Firefox"
explain = "Firefox's web cache, startup cache and thumbnails. Firefox rebuilds them; close Firefox first."
match.path_glob = ['{LOCALAPPDATA}\Mozilla\Firefox\Profiles\*\*', '{FIREFOX_PROFILE}\*']
match.dir_name = ["cache2", "startupCache", "thumbnails", "jumpListCache", "OfflineCache", "shader-cache"]

[[rule]]
id = "browsers.mozilla_profile_detected"
name = "Mozilla profile"
category = "apps"
safety = "never"
app = "Mozilla Firefox / Thunderbird"
explain = "A Firefox or Thunderbird profile (it contains places.sqlite / prefs.js): browsing or mail data. Not junk."
match.dir_name = "*"
match.requires_child = ["places.sqlite", "prefs.js"]
