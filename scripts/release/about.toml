# cargo-about configuration for the third-party notices bundled with Strata.
# Used by scripts/release/licenses.mjs. Only licenses listed here may ship; a
# dependency under anything else fails the release build until it is reviewed.

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "0BSD",
]

# Only what ships in the Windows installers.
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Strata's own crates are covered by the project license.
private = { ignore = true }
