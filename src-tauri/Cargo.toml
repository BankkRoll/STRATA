[package]
name = "strata-app"
description = "Strata desktop app (unelevated UI process)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "strata_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json = { workspace = true }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "2.13"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
getrandom = "0.4.3"
strata-core = { path = "../crates/strata-core" }
strata-index = { path = "../crates/strata-index" }
strata-layout = { path = "../crates/strata-layout" }
strata-classify = { path = "../crates/strata-classify" }
strata-store = { path = "../crates/strata-store" }
strata-live = { path = "../crates/strata-live" }

# NOTE: the scanners, the cleaner, the helper client and the Win32 layer only
# build on Windows, which is the only platform Strata ships for.
[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"
strata-clean = { path = "../crates/strata-clean" }
strata-dupes = { path = "../crates/strata-dupes" }
strata-helper = { path = "../crates/strata-helper" }
strata-ipc = { path = "../crates/strata-ipc" }
strata-ntfs = { path = "../crates/strata-ntfs" }
strata-walk = { path = "../crates/strata-walk" }
strata-win = { path = "../crates/strata-win" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
